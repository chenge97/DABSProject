resources:
  jobs:
    medallion: # This is the one you need to use in the databricks bundle run command
      name: medallion # Title of the Job
      parameters:
        - name: "environment"
          default: "${bundle.target}" #dev/staging/prod
        - name: catalog_name
          default: medallion_${bundle.target}
        - name: schema
          default: "${var.schema_medallion_name}"

        
      queue:
        enabled: true
      tasks:
        - task_key: bronze_layer
          notebook_task:
            notebook_path: ../../src/bronze.ipynb
        - task_key: silver_layer
          notebook_task:
            notebook_path: ../../src/silver.ipynb
          depends_on:
            - task_key: "bronze_layer" # depends on name
        - task_key: unit_tests_flag
          depends_on:
            - task_key: "silver_layer" # depends on name
          condition_task: 
            left: "{{job.parameters.environment}}"
            op: "EQUAL_TO"
            right: dev
        - task_key: unit_tests
          notebook_task:
            notebook_path: ../../tests/unit_tests.ipynb
          depends_on:
            - task_key: "unit_tests_flag" # depends on name
              outcome: true
        - task_key: gold_layer
          notebook_task:
            notebook_path: ../../src/gold.ipynb
          depends_on:
            - task_key: "silver_layer" # depends on name